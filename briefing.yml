name: Economic briefing

on:
  schedule:
    - cron: "0 6 * * *"   # 07:00 UK during BST; run.py skips unless London hour is 7
    - cron: "0 7 * * *"   # 07:00 UK during GMT
    - cron: "15 8-22/2 * * *"  # ingest + markets refresh through the day
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh = rebuild today's briefing now"
        default: refresh
        type: choice
        options: [refresh, ingest]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 8-22/2 * * *" ]; then
            echo "mode=ingest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python pipeline/run.py ${{ steps.mode.outputs.mode }}
      - name: Commit data
        if: always()
        run: |
          git config user.name "econ-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: ${{ steps.mode.outputs.mode }} $(date -u +%FT%TZ)" && git pull --rebase && git push)
      - name: Assemble site
        if: always()
        run: |
          mkdir _site
          cp -r site/* _site/
          cp -r data _site/data
          rm -f _site/data/items.json
          cp config/calendar.json _site/config-calendar.json
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site

  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
